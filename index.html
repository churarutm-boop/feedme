<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แมวในไลฟ์ (ต้นแบบ)</title>
<style>
:root { color-scheme: light dark; --bg:#fdf3e7; --fg:#333; --room:#f4d9b5; --card:#fff; --bar:#e8c9a0; --accent:#e0735c; }
@media (prefers-color-scheme: dark) { :root { --bg:#1e1b18; --fg:#eee; --room:#4a3b2c; --card:#2b2620; --bar:#5a4a38; --accent:#f08a72; } }
* { box-sizing: border-box; }
body { margin:0; padding:12px; font-family: system-ui, "Sarabun", sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; flex-direction:column; align-items:center; }
h1 { font-size:18px; margin:4px 0 10px; }
#room { position:relative; width:100%; max-width:380px; height:220px; background:var(--room); border-radius:16px; overflow:hidden; }
#cat { position:absolute; bottom:70px; left:50%; font-size:72px; transform:translateX(-50%); transition:left 1.4s ease-in-out; user-select:none; cursor:pointer; }
#cat.sleep { transform:translateX(-50%) rotate(-12deg); }
#cat.squint::after { content:""; }
#bowl { position:absolute; bottom:18px; left:24px; font-size:36px; }
#fish { position:absolute; bottom:24px; right:24px; font-size:28px; opacity:0; transition:opacity .3s; }
#bubble { position:absolute; top:14px; left:50%; transform:translateX(-50%); background:var(--card); padding:6px 12px; border-radius:12px; font-size:14px; opacity:0; transition:opacity .3s; white-space:nowrap; }
.hearts { position:absolute; top:90px; left:50%; transform:translateX(-50%); font-size:20px; opacity:0; transition:opacity .3s; }
.hearts.on { opacity:1; }
#panel { width:100%; max-width:380px; background:var(--card); border-radius:14px; padding:12px; margin-top:12px; }
.stat { margin:6px 0; font-size:14px; }
.bar { height:10px; background:var(--bar); border-radius:6px; overflow:hidden; margin-top:3px; }
.fill { height:100%; background:var(--accent); width:0%; transition:width .4s; }
#status { font-size:15px; margin:8px 0 2px; font-weight:600; }
#unlocks { font-size:13px; margin-top:6px; opacity:.85; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; width:100%; max-width:380px; }
button { padding:12px 6px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
button.alt { background:var(--bar); color:var(--fg); }
#log { width:100%; max-width:380px; margin-top:12px; font-size:12px; background:var(--card); border-radius:12px; padding:10px; height:130px; overflow-y:auto; line-height:1.6; }
.label { font-size:12px; opacity:.7; margin-top:14px; width:100%; max-width:380px; }
</style>
</head>
<body>

<h1>แมวในไลฟ์ (ต้นแบบ)</h1>

<div id="room">
  <div id="bubble"></div>
  <div class="hearts" id="hearts">💕💕💕</div>
  <div id="cat" title="ลูบแมว">🐱</div>
  <div id="bowl">🥣</div>
  <div id="fish">🐟</div>
  <div id="toy" style="position:absolute;bottom:30px;right:120px;font-size:30px;cursor:pointer;">🧶</div>
  <div id="bed" style="position:absolute;top:40px;right:14px;font-size:40px;cursor:pointer;">🛏️</div>
</div>

<div id="panel">
  <div id="status">สถานะ: ปกติ</div>
  <div class="stat">หิว <span id="hungerVal">0</span>%<div class="bar"><div class="fill" id="hungerBar"></div></div></div>
  <div class="stat">ง่วง <span id="sleepVal">0</span>%<div class="bar"><div class="fill" id="sleepBar"></div></div></div>
  <div class="stat">สนิท <span id="bondVal">0</span><div class="bar"><div class="fill" id="bondBar"></div></div></div>
  <div class="stat">ผู้เยี่ยมชม <span id="visitors">0</span> คน</div>
  <div id="unlocks">ยังไม่ปลดล็อกอะไร</div>
</div>

<div class="label">ปุ่มจำลองสัญญาณจากไลฟ์ (แทนการเชื่อม TikTok จริง)</div>
<div class="grid">
  <button data-sim="feed">🍚 กดให้อาหาร (กด 2 ครั้ง = 1 มื้อ)</button>
  <button data-sim="pet">✋ กดลูบหัว (5 ครั้ง = +สนิท)</button>
  <button class="alt" data-sim="comment">💬 คอมเมนต์ทักทาย</button>
  <button class="alt" data-sim="share">🔗 แชร์ พาเพื่อนมา</button>
  <button class="alt" data-sim="gift">🎁 ของขวัญปลา</button>
  <button class="alt" data-sim="disconnect">📡 จำลองสัญญาณขาด</button>
</div>

<div class="label">ทดลองคอมเมนต์ (พิมพ์: อาหาร, ลูบ, เล่น, ปลุก หรือข้อความอื่นเพื่อทักทาย)</div>
<div style="width:100%;max-width:380px;margin-top:6px;"><input id="uname" placeholder="ชื่อผู้ใช้ เช่น ฉัน" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bar);background:var(--card);color:var(--fg);font-size:14px;box-sizing:border-box;"></div>
<div style="width:100%;max-width:380px;display:flex;gap:8px;margin-top:6px;">
  <input id="cmt" placeholder="พิมพ์คอมเมนต์ เช่น อาหาร" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--bar);background:var(--card);color:var(--fg);font-size:14px;">
  <button id="sendCmt" style="padding:10px 16px;">ส่ง</button>
</div>

<div class="label">บันทึกเหตุการณ์</div>
<div id="log"></div>

<script>
// ---- state (in memory only; ไม่ใช้ localStorage) ----
const S = { hunger: 20, sleep: 10, bond: 0, visitors: 0, feedTaps: 0, petTaps: 0, online: true, sleeping: false, eating: false };
const UNLOCKS = [
  { at: 20, text: "ปลดล็อกชื่อ: มะลิ" },
  { at: 50, text: "ปลดล็อกของตกแต่ง: ชามลายดอกไม้" },
  { at: 80, text: "ปลดล็อกท่าทาง: นอนหงาย" }
];

const $ = id => document.getElementById(id);
const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));

function log(msg) {
  const t = new Date().toLocaleTimeString("th-TH");
  $("log").innerHTML = `<div>[${t}] ${msg}</div>` + $("log").innerHTML;
}
function bubble(msg, ms = 1800) {
  $("bubble").textContent = msg;
  $("bubble").style.opacity = 1;
  clearTimeout(bubble.t);
  bubble.t = setTimeout(() => $("bubble").style.opacity = 0, ms);
}

// ---- cat movement ----
function moveCat(toBowl) {
  $("cat").style.left = toBowl ? "22%" : "50%";
}

// ---- actions ----
function feed() {
  if (S.sleeping) { bubble("zzz... ให้ตื่นก่อนนะ"); return; }
  S.feedTaps++;
  if (S.feedTaps < 2) { bubble("กดอีกครั้งเพื่อให้อาหาร (1/2)"); log("กดให้อาหารแล้ว 1/2 ครั้ง"); return; }
  S.feedTaps = 0;
  S.eating = true;
  S.hunger = clamp(S.hunger - 40);
  moveCat(true);
  $("fish").style.opacity = 0;
  setTimeout(() => {
    $("cat").textContent = "😸";
    bubble("ม้วม ๆ อร่อย!");
    log("แมวกินอาหาร 1 มื้อ");
    setTimeout(() => { $("cat").textContent = "🐱"; moveCat(false); S.eating = false; }, 2000);
  }, 1400);
  render();
}

function pet() {
  if (S.sleeping) { wake(); return; }
  S.petTaps++;
  if (S.petTaps >= 5) {
    S.petTaps = 0;
    S.bond = clamp(S.bond + 5, 0, 999);
    showHearts(true);
    bubble("เพิร์ร... คลอเคลีย");
    log("ลูบแมวครบ 5 ครั้ง สนิท +5");
    checkUnlocks();
    setTimeout(() => showHearts(false), 2000);
  } else {
    log(`ลูบแมว ${S.petTaps}/5`);
  }
  render();
}

function comment() {
  S.bond = clamp(S.bond + 1, 0, 999);
  bubble("สวัสดี!");
  log("มีคนคอมเมนต์ทักทาย สนิท +1");
  checkUnlocks();
  render();
}

function share() {
  S.visitors++;
  bubble("เพื่อนมาเยี่ยมแล้ว!");
  log("มีคนแชร์ไลฟ์ เพื่อนเข้ามา +1");
  render();
}

function gift() {
  // ของขวัญแน่นอน ไม่สุ่ม เพื่อเลี่ยงความเสี่ยงเรื่องการพนัน
  S.hunger = clamp(S.hunger - 20);
  S.bond = clamp(S.bond + 3, 0, 999);
  $("fish").style.opacity = 1;
  setTimeout(() => $("fish").style.opacity = 0, 2500);
  const n = $("uname").value.trim() || "ผู้ชม";
  bubble("ขอบคุณ " + n + " สำหรับของขวัญ!", 2500);
  log(n + " ส่งของขวัญปลา: แมวกินและสนิท +3");
  checkUnlocks();
  render();
}

function wake() {
  S.sleeping = false;
  S.sleep = 30;
  $("cat").classList.remove("sleep");
  $("cat").textContent = "🐱";
  bubble("ตื่นแล้ว!");
  log("แมวตื่นจากการลูบ");
  render();
}

function showHearts(on) { $("hearts").classList.toggle("on", on); }

function checkUnlocks() {
  const got = UNLOCKS.filter(u => S.bond >= u.at).map(u => u.text);
  $("unlocks").textContent = got.length ? got.join(" · ") : "ยังไม่ปลดล็อกอะไร";
  $("cat").style.filter = S.bond >= 30 ? "brightness(1.05)" : "none";
}

function play() {
  if (S.sleeping) { bubble("zzz... ให้ตื่นก่อน"); return; }
  S.bond = clamp(S.bond + 2, 0, 999);
  S.sleep = clamp(S.sleep + 5);
  moveCat(false);
  bubble("เล่นกับแมวสนุกจัง!");
  log("เล่นกับของเล่น สนิท +2");
  checkUnlocks();
  render();
}

function bed() {
  if (S.sleeping) { wake(); return; }
  bubble("แมวยังไม่ง่วงเลย");
}

function handleComment(text) {
  const t = text.trim();
  if (!t) return;
  const n = $("uname").value.trim() || "ผู้ชม";
  log(n + ": " + t);
  if (t.includes("อาหาร")) feed();
  else if (t.includes("ลูบ")) pet();
  else if (t.includes("เล่น")) play();
  else if (t.includes("ปลุก")) bed();
  else if (t.includes("ปลา")) gift();
  else { comment(); bubble("สวัสดี " + n + "!", 2000); }
  $("cmt").value = "";
}

// ---- simulated live events ----
function sim(type) {
  if (type === "disconnect") {
    S.online = false;
    log("สัญญาณขาด ระบบยังทำงานต่อด้วยสถานะเดิม");
    setTimeout(() => { S.online = true; log("สัญญาณกลับมา"); }, 5000);
    return;
  }
  if (type === "feed") feed();
  if (type === "pet") pet();
  if (type === "comment") comment();
  if (type === "share") share();
  if (type === "gift") gift();
}

// ---- tick: สถานะเปลี่ยนเองตามเวลา แม้ไม่มีใครกด ----
function tick() {
  if (!S.eating) {
    S.hunger = clamp(S.hunger + 0.6);
    S.bond = clamp(S.bond - 0.02, 0, 999);
  }
  if (!S.sleeping) S.sleep = clamp(S.sleep + 0.3);

  if (!S.sleeping && S.sleep >= 80) {
    S.sleeping = true;
    $("cat").classList.add("sleep");
    $("cat").textContent = "😴";
    bubble("zzz...");
    log("แมวหลับ ลูบเพื่อปลุก");
  }

  if (S.hunger >= 70 && !S.eating && !S.sleeping) {
    moveCat(true);
    bubble("หิวแล้ว... มาให้อาหารหน่อย");
    setTimeout(() => { if (!S.eating) moveCat(false); }, 4000);
  }
  render();
}

function render() {
  $("hungerVal").textContent = Math.round(S.hunger);
  $("sleepVal").textContent = Math.round(S.sleep);
  $("bondVal").textContent = Math.round(S.bond);
  $("visitors").textContent = S.visitors;
  $("hungerBar").style.width = S.hunger + "%";
  $("sleepBar").style.width = S.sleep + "%";
  $("bondBar").style.width = clamp(S.bond) + "%";

  let status = "ปกติ";
  if (S.sleeping) status = "กำลังหลับ";
  else if (S.eating) status = "กำลังกิน";
  else if (S.hunger >= 70) status = "หิวมาก";
  else if (S.sleep >= 60) status = "ง่วง";
  else if (S.bond >= 50) status = "สนิทกับทุกคน";
  $("status").textContent = "สถานะ: " + status + (S.online ? "" : " (สัญญาณขาด)");

  $("cat").style.transform = (S.sleeping ? "translateX(-50%) rotate(-12deg)" : "translateX(-50%)");
  if (S.bond >= 80) $("cat").textContent = S.sleeping ? "😴" : (S.eating ? "😸" : "🐱");
}

document.querySelectorAll('[data-sim]').forEach(b => b.addEventListener('click', () => sim(b.dataset.sim)));
$("bowl").addEventListener('click', feed);
$("cat").addEventListener('click', pet);
$("toy").addEventListener('click', play);
$("bed").addEventListener('click', bed);
$("sendCmt").addEventListener('click', () => handleComment($("cmt").value));
$("cmt").addEventListener('keydown', e => { if (e.key === 'Enter') handleComment($("cmt").value); });
setInterval(tick, 1000);
render();
log("พร้อมทดสอบ กดปุ่มด้านล่างเพื่อจำลองสัญญาณจากไลฟ์");
</script>
</body>
</html>
